<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Getting Started with VR</title>
    <meta name="description" content="Getting Started with VR">
    <meta charset="utf-8">
    <script src="https://aframe.io/releases/0.9.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
        <a-sky src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg" rotation="0 -130 0"></a-sky>
  

        <a-assets>
          <img id="groundTexture" src="https://cdn.aframe.io/a-painter/images/floor.jpg">
        </a-assets>
        <a-plane src="#groundTexture" rotation="-90 0 0" width="40" height="40" repeat="10 10"></a-plane>

        <a-entity light="type: ambient; intensity: 0.5"></a-entity>
        <a-entity light="type: point; intensity: 1.2; castShadow: true" position="5 8 5"></a-entity>
  
        <a-assets>
            <img id="brickTexture" src="https://cdn.aframe.io/a-painter/images/floor.jpg">
          </a-assets>
          
          <a-box id="box1" src="https://i.imgur.com/mYmmbrp.jpg" position="-2 4 -5" rotation="0 45 45"
  scale="2 2 2"></a-box>
          
        <a-sphere position="0 1.5 -6" radius="1.25" color="#EF2D5E" shadow></a-sphere>
        <a-cylinder position="3 1 -4" radius="0.75" height="2" color="#FFC65D" shadow></a-cylinder>

        <a-entity position="0 1.6 0">
          <a-camera wasd-controls-enabled="true" look-controls-enabled="true"></a-camera>
        </a-entity>
      </a-scene>
  </body>
</html>
